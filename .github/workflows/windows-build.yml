name: windows-build

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,build]"
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Build single-file Windows executable
        run: python -m PyInstaller --noconfirm --clean packaging/AI-Customer-Service.spec
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\AI-Customer-Service.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)" }
      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            choco install nsis --no-progress -y
          }
      - name: Create portable and installer artifacts
        shell: pwsh
        run: |
          $release = Join-Path $PWD "release"
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item -LiteralPath "dist\AI-Customer-Service.exe" -Destination $release -Force
          Compress-Archive -LiteralPath "dist\AI-Customer-Service.exe" -DestinationPath "$release\AI-Customer-Service-Portable.zip" -Force
          $version = python -c "import importlib.metadata; print(importlib.metadata.version('ai-store-support'))"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/INPUTCHARSET" "UTF8" "/DSOURCE_DIR=$PWD\dist" "/DOUTPUT_DIR=$release" "/DAPP_VERSION=$version" "/DAPP_VERSION_NUM=$version.0" "packaging\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed with exit code $LASTEXITCODE" }
          Get-ChildItem -LiteralPath $release -File |
            ForEach-Object { "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $($_.Name)" } |
            Set-Content -LiteralPath "$release\SHA256SUMS.txt" -Encoding ascii
      - name: Upload Windows executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Customer-Service-windows-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
